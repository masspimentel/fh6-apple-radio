<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>FH6 Apple Music Helper</title>
    <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js"></script>
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            background: #111;
            color: #eee;
            margin: 24px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 14px;
            box-sizing: border-box;
            background: #181818;
            color: #eee;
            border: 1px solid #444;
        }

        button {
            padding: 10px 14px;
            margin: 4px 4px 4px 0;
            cursor: pointer;
            background: #222;
            color: #eee;
            border: 1px solid #555;
        }

        .result {
            display: block;
            width: 100%;
            text-align: left;
            margin: 6px 0;
            padding: 10px;
            background: #222;
            color: #eee;
            border: 1px solid #444;
        }

        .muted {
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>FH6 Apple Music Helper</h1>

    <p class="muted">
        This helper hosts Apple Music playback in a dedicated process.
    </p>

    <label>
        Developer Token
        <input id="token" type="password" placeholder="Paste MusicKit developer token">
    </label>

    <label>
        Storefront
        <input id="storefront" type="text" value="ca">
    </label>

    <button id="configure">Configure</button>
    <button id="authorize">Authorize</button>

    <hr>

    <form id="search-form">
        <input id="query" type="text" placeholder="Search Apple Music">
        <button type="submit">Search</button>
    </form>

    <div id="status" class="muted"></div>
    <div id="results"></div>

    <script src="apple_player.js"></script>
</body>
</html>
